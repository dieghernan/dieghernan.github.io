<!-- start custom scripts to be placed at the bottom of the page -->
<script>
for (const a of document.querySelectorAll(".badge")) {
    if (a.textContent.match("discontinued")) {
        a.classList.add("bg-danger");
    }
}
for (const a of document.querySelectorAll(".btn")) {
    if (a.textContent.match("discontinued")) {
        a.classList.add("bg-danger");
        a.classList.add("border-danger");
    }
}

for (const a of document.querySelectorAll("h5")) {
    if (a.textContent.match("discontinued")) {
        a.classList.add("text-danger");
    }
}
</script>

<!-- end custom bottom scripts -->
{% if page.tag_aliases %}
<script>
const tagAliases = {{ page.tag_aliases | jsonify }};
for (const [alias, tag] of Object.entries(tagAliases)) {
    const section = document.getElementById(tag);
    if (section && !document.getElementById(alias)) {
        const anchor = document.createElement("span");
        anchor.id = alias;
        section.prepend(anchor);
    }
}
const legacyTag = document.getElementById(location.hash.slice(1));
if (legacyTag && Object.hasOwn(tagAliases, location.hash.slice(1))) {
    legacyTag.scrollIntoView();
}
</script>
{% endif %}
