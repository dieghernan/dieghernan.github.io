{%- assign citation_title = page.title
  | markdownify
  | strip_html
  | normalize_whitespace -%}
{%- assign citation_url = page.url | absolute_url -%}
{%- assign citation_author = page.bib_author
  | default: page.author.name
  | default: site.bib_author
  | default: site.author.name -%}
<meta name="citation_title" content="{{ citation_title | escape }}">
<meta name="citation_author" content="{{ citation_author | escape }}">
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_fulltext_html_url" content="{{ citation_url | escape }}">
