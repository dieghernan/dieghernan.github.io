[build]
  base = "."
  command = "bundle exec jekyll build --config _config.yml,_config_build.yml --drafts"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.4"
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = true

# Lighthouse, Jekyll Cache and branch settings remain configured in Netlify.
