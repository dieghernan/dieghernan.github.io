# Chulapa configuration for One World
# Sections follow https://dieghernan.github.io/chulapa/docs/02-config
# Only configured site options are listed here.

# Installation
github:
- metadata
remote_theme: dieghernan/chulapa

# A. Site settings/SEO
locale: en-US
title: One World
subtitle: R packages, maps and open-source projects
description: R packages, spatial data, maps and open-source projects by dieghernan
url: https://dieghernan.github.io
baseurl: ''
repository: dieghernan/dieghernan.github.io
timezone: Europe/Madrid

# A.1. SEO and author
og_image: "./assets/img/site/banner.png"
og_image_alt: Raster map with irregular areas in magenta, orange, yellow and turquoise.
og_image_width: 799
og_image_height: 429
og_image_type: image/png
twitter_site: dhernangomez
author:
  name: dieghernan
  url: https://github.com/dieghernan
  avatar: "./assets/img/site/avatar.png"
  location: Madrid, Spain
  links:
  - url: https://x.com/dhernangomez
    icon: fab fa-square-x-twitter
    label: My Twitter/X
  - url: https://fosstodon.org/@dhernangomez
    icon: fa-brands fa-mastodon
    label: My Mastodon
  - url: https://bsky.app/profile/dieghernan.bsky.social
    icon: fa-brands fa-square-bluesky
    label: My Bluesky
  - url: https://github.com/dieghernan/
    icon: fab fa-github
    label: My GitHub
  - url: https://stackoverflow.com/users/7877917/dieghernan
    icon: fab fa-stack-overflow
    label: On StackOverflow
  - url: https://orcid.org/0000-0001-8457-4658
    icon: fa-brands fa-orcid
    label: My Orcid

# A.1.1. Publisher
publisher:
  type: Person
  name: dieghernan
  url: https://dieghernan.github.io/
  image: "/assets/img/site/avatar.png"

# A.2. Font Awesome
fa_kit_code: afe0d1dec9

# A.3. Google Analytics
gtag_id: G-FWXW2HLTVZ

# A.4. Search engines
search:
  provider: algolia
  algolia_logo: true
  maxwords: 500
algolia:
  application_id: KOIKA5PDQO
  index_name: blog
  search_only_api_key: 7f1fe42bef3f03458cb3a911ebc7e0ac
  files_to_exclude:
  - _layouts/*.html
  - _includes/*.html
  - oldcontent/*.html
  - oldcontent/*.md
  extensions_to_index:
  - html
  - md
  searchableAttributes:
  - title
  - headings
  - unordered(content)
  - unordered(subtitle)
  - unordered(categories)
  - unordered(collection)
  - unordered(tags)
  customRanking:
  - desc(include_on_search)
  - desc(title)
  - desc(content)
  - desc(subtitle)

# A.5. Comments
comments:
  provider: giscus

# B.1. Navbar
navbar:
  expand: xl
  brand:
    title: One World
    img: https://dieghernan.github.io/assets/img/favicons/android-chrome-72x72.png
  nav:
  - title: Blog
    url: "/blog/"
  - title: Projects
    url: "/projects"
  - title: About
    url: "/about"
  - title: Archives
    child:
    - title: By date
      url: "/archive"
    - title: By tags
      url: "/tags"
  - title: Gallery
    url: "/gallery"
  - title: <i class="fab fa-github" aria-hidden="true"></i> GitHub repo
    url: https://github.com/dieghernan/dieghernan.github.io
  - title: <i class="fas fa-external-link-alt" aria-hidden="true"></i> R-bloggers
    url: https://www.r-bloggers.com/

# B.2. Footer
footer:
  links:
  - label: RSS
    icon: fa fa-rss
    url: "./atom.xml"
  - label: Stack Overflow
    icon: fab fa-stack-overflow
    url: https://stackoverflow.com/users/7877917/dieghernan
  - label: WikiCommons
    icon: fab fa-wikipedia-w
    url: https://commons.wikimedia.org/wiki/Special:ListFiles?limit=50&user=dieghernan84
  - label: GitHub
    icon: fab fa-github
    url: https://github.com/dieghernan/
  - label: RPubs
    icon: fab fa-r-project
    url: https://rpubs.com/dieghernan

# C.1. Google Fonts
googlefonts:
- url: https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap
- url: https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap

# C.2. Skin, syntax highlighting and colors
chulapa-skin:
  highlight: cran
  skin: gitdev
  vars:
    font-family-monospace: Fira Code

# D.1. Pagination
paginate: 5
paginate_path: "/blog/page:num/"
paginator_maxnum: 3

# D.2. Collections and permalinks
collections:
  projects:
    output: true
    permalink: "/projects/:title"
  posts:
    output: true
    permalink: "/:year:month_:title/"
collections_dir: collections
permalink: "/:title"

# D.3. Front matter defaults
defaults:
- scope:
    path: ''
  values:
    layout: default
    header_type: base
    include_on_search: false
    cloudtag_url: "/tags"
    cloudcategory_url: "/categories"
- scope:
    path: ''
    type: posts
  values:
    header_type: post
    include_on_search: true
    include_on_feed: true
    show_date: true
    show_related: true
    related_label: "<h5>Related posts</h5>"
    show_bottomnavs: true
    show_sociallinks: true
    show_comments: true
    show_tags: true
    show_sidetoc: true
    show_categories: true
    show_author: true
    show_breadcrumb: true
    show_kofi: true
    breadcrumb_list:
    - label: Blog
      url: "/blog/"
- scope:
    path: ''
    type: projects
  values:
    header_type: hero
    show_random: true
    random_label: "<h5>You may also enjoy...</h5>"
    show_bottomnavs: true
    show_sociallinks: true
    include_on_search: true
    show_tags: true
    show_breadcrumb: true
    include_on_feed: true
    breadcrumb_list:
    - label: Projects
      url: "/projects"
- scope:
    path: assets/img/blog
  values:
    image_col: imgblog

# XX.1. HTML compression
compress_html:
  clippings: all
  blanklines: true

# XX.2. Plugins
plugins:
- jekyll-github-metadata
- jekyll-paginate
- jekyll-include-cache
- jekyll-sitemap
- jekyll-redirect-from
- jekyll-remote-theme

# XX.3. Files to exclude or include
exclude:
- AGENTS.md
- LICENSE
- README.md
- Gemfile
- vendor
- oldcontent
- ".gitattributes"
include:
- _pages

# XX.4. Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: true

# XX.5. Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: "&uarr;"
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# XX.6. Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - abs-percent
  - function-units
