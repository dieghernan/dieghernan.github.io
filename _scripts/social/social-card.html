<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One World — social card</title>
  <style>
    @font-face { font-family: Inter; src: url('./fonts/Inter.ttf'); font-weight: 100 900; }
    @font-face { font-family: 'Inter Tight'; src: url('./fonts/InterTight.ttf'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #22272e; color: #fff; font-family: Inter, sans-serif; }
    .map { position: absolute; inset: 0 0 0 34%; overflow: hidden; }
    .map img { width: 100%; height: 100%; object-fit: cover; object-position: 58% center; image-rendering: auto; }
    .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #22272e 0%, #22272e 32%, #22272ed9 44%, #22272e00 76%); }
    main { position: absolute; inset: 10.3% 5%; }
    .tag { color: #79b8ff; font-size: 1.5625vw; font-weight: 600; }
    h1 { margin: 4.5vw 0 0; font: 800 8vw/1.04 'Inter Tight', sans-serif; letter-spacing: -.2vw; }
    .description { margin: 3.1vw 0 0; font-size: 2.2vw; line-height: 1.45; }
    footer { position: absolute; bottom: 0; color: #fff; font-size: 1.5625vw; }
    .credit { position: absolute; bottom: 3%; right: 3%; background: #22272ef2; color: #fff; padding: .6em .9em; font-size: 1.015625vw; }
  </style>
</head>
<body>
  <div class="map"><img src="../../assets/img/site/banner.png" alt="Raster map in magenta, orange, yellow and turquoise"></div>
  <div class="fade"></div>
  <main>
    <div class="tag">MAPS · CODE · OPEN SOURCE</div>
    <h1>One<br>World</h1>
    <p class="description">R packages, maps<br>and open-source projects.</p>
    <footer>Explore the maps. Discover the code.</footer>
  </main>
  <div class="credit">dieghernan · dieghernan.github.io</div>
</body>
</html>
