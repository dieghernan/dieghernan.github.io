name: Test project structured data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structured-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build site with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config_build.yml
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      - name: Check project structured data
        run: python -m unittest discover -s _scripts -p 'test_structured_data.py'
