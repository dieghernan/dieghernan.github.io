# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Based on https://github.com/actions/starter-workflows/blob/main/pages/jekyll.yml
name: Deploy Chulapa Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build site with Jekyll
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to work out-of-the-box with jekyll-github-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
          working-directory: '.' # Default directory of the site, change it to 'docs' if the site is hosted in (e.g.) 'docs' folder
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: |
          cd  . # Change it to 'docs' if the site is hosted in (e.g.) 'docs' folder
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        shell: bash
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/ # Change it to 'docs/_site/' if the site is hosted in (e.g.) 'docs' folder
          include-hidden-files: true # Publish .well-known/atproto-did

  # Deployment job
  deploy:
    name: Deploy to web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  push-gh-pages:
    name: Push site to gh-pages branch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download the built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Unpack site
        run: |
          mkdir -p published-site
          tar -xf pages-artifact/artifact.tar -C published-site
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: published-site

  algolia:
    name: Update Algolia index
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Algolia Jekyll Action
        uses: dieghernan/algolia-jekyll-action@v2.1
        with:
          ruby-version: 3.4
          APIKEY: '${{ secrets.ALGOLIA_API_KEY }}'

  webmentions:
    name: Send outgoing Webmentions
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A receiver/network failure must not turn a successful deployment into a failure.
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    concurrency:
      group: outgoing-webmentions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the deployed site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Unpack site
        run: |
          mkdir -p "$RUNNER_TEMP/published-site"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/published-site"
      - name: Load durable delivery state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init -b webmention-state "$RUNNER_TEMP/webmention-state"
          cd "$RUNNER_TEMP/webmention-state"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin webmention-state; then
            git fetch --depth=1 origin webmention-state
            git reset --hard FETCH_HEAD
            test -f state.json
          else
            status=$?
            # ls-remote returns 2 only when the branch does not exist.
            test "$status" -eq 2
          fi
      - name: Send mentions for published posts
        run: >-
          python _scripts/webmentions.py
          --site "$RUNNER_TEMP/published-site"
          --state "$RUNNER_TEMP/webmention-state/state.json"
      - name: Save delivery state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/webmention-state"
          if test -f state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record outgoing Webmention deliveries'
              git push origin HEAD:refs/heads/webmention-state
            fi
          fi
