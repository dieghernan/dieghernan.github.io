# Based on https://github.com/actions/starter-workflows/blob/main/pages/jekyll.yml
name: Deploy Chulapa Jekyll site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site with Jekyll
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
          working-directory: '.'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: |
          cd .
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        shell: bash
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          include-hidden-files: true


  deploy:
    name: Deploy to web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  push-gh-pages:
    name: Push site to gh-pages branch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact

      - name: Unpack site
        run: |
          mkdir -p published-site
          tar -xf pages-artifact/artifact.tar -C published-site

      - name: Find changed HTML pages
        shell: bash
        run: |
          mkdir -p previous-site

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C previous-site
          fi

          (
            cd previous-site
            find . -type f -name '*.html' -print0 |
              sort -z |
              xargs -0 -r sha256sum
          ) > previous.txt

          (
            cd published-site
            find . -type f -name '*.html' -print0 |
              sort -z |
              xargs -0 -r sha256sum
          ) > current.txt

          {
            sed 's|^[^ ]*  \./||' previous.txt
            sed 's|^[^ ]*  \./||' current.txt
          } | sort -u |
          while read -r file; do
            old=$(grep -F "  ./$file" previous.txt || true)
            new=$(grep -F "  ./$file" current.txt || true)

            if [ "$old" != "$new" ]; then
              echo "$file"
            fi
          done > changed-pages.txt

          echo "Changed HTML pages:"
          cat changed-pages.txt

      - name: Upload changed pages list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-changed-pages
          path: changed-pages.txt
          if-no-files-found: error

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: published-site


  indexnow:
    name: Notify IndexNow
    needs: [deploy, push-gh-pages]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download changed pages list
        uses: actions/download-artifact@v8
        with:
          name: indexnow-changed-pages

      - name: Notify IndexNow
        shell: bash
        run: |
          if [ -s changed-pages.txt ]; then
            mapfile -t pages < changed-pages.txt
            node _scripts/indexnow.mjs "${pages[@]}"
          else
            echo "IndexNow: no changed HTML pages to submit."
          fi


  algolia:
    name: Update Algolia index
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Algolia Jekyll Action
        uses: dieghernan/algolia-jekyll-action@v2.1
        with:
          ruby-version: 3.4
          APIKEY: '${{ secrets.ALGOLIA_API_KEY }}'